<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Savdochi — Xavfsiz P2P Bitimlar</title>
    <meta name="theme-color" content="#0b0e14" />
    <meta name="color-scheme" content="dark" />
    <style>
      /* Critical first-paint: dark bg, hide app shell until boot, show loader instantly.
         Full styling arrives with app.css (JS-injected); this only prevents the
         home-shell flash before JS runs. JS reveals #app when the loader finishes. */
      html {
        background: #0b0e14;
      }
      body {
        margin: 0;
        background: #0b0e14;
        color: #f2f5fa;
      }
      #app {
        visibility: hidden;
      }
      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        max-width: 560px;
        left: 50%;
        transform: translateX(-50%);
        height: 100vh;
        background: linear-gradient(180deg, #0e121c 0%, #0b0e14 52%);
      }
      #app-loader .loader-center {
        text-align: center;
        padding: 0 12px;
      }
    </style>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <script src="/js/telegram-web-app.js"></script>
    <script src="/js/tonconnect-ui.min.js"></script>
    <script>
      if (!window.TonConnectUI) {
        var s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/@tonconnect/ui@2/dist/tonconnect-ui.min.js';
        s.async = false;
        document.head.appendChild(s);
      }
    </script>
  </head>
  <body data-scheme="dark" data-theme-mode="dark">
    <!-- Mini App loader: TrueFocus "Xafsiz Savdo", 4.5s (compact) -->
    <div id="app-loader" role="status" aria-live="polite" aria-label="Loading Savdochi">
      <div class="loader-aurora" aria-hidden="true"></div>
      <div class="loader-center">
        <div id="loader-focus" aria-hidden="true"></div>
        <div class="loader-bar" aria-hidden="true"><div class="loader-fill"></div></div>
        <div class="loader-meta"><span class="loader-pct">0%</span> · vault syncing</div>
      </div>
      <div class="loader-foot">Non-custodial · Audited · Telegram Mini App</div>
    </div>
    <div id="app">
      <header id="topbar" class="topbar" role="banner">
        <button id="tb-back" class="icon-btn hidden" aria-label="Back">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path fill="currentColor" d="M15.5 19.5 8 12l7.5-7.5 1.4 1.4L10.8 12l6.1 6.1z" />
          </svg>
        </button>
        <div id="tb-title" class="topbar-title">Savdochi</div>
        <button id="tb-action" class="icon-btn hidden" aria-label="Action"></button>
      </header>

      <main id="view" class="view-root" aria-live="polite" role="main"></main>

      <nav id="tabbar" class="tabbar" role="navigation" aria-label="Main navigation">
        <!-- Bottom tabs are rendered by GooeyNav (see src/lib/gooey-nav.ts, mounted from patches.ts). -->
      </nav>
    </div>

    <div id="toast-root" aria-live="assertive"></div>
    <div id="sheet-root" role="dialog" aria-modal="true"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
