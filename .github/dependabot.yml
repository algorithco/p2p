        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: '/signer'
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: '/ubot'
    schedule:
      interval: weekly
    groups:
