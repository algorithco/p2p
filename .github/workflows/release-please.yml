# Automated releases via release-please (Conventional Commits).
# Merging to main with feat:/fix: opens a "chore: release x.y.z" PR;
# merging THAT tags v* + creates a GitHub Release, which triggers
# docker-publish (semver + latest images).
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release please
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          release-type: node
